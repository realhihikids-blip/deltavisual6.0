name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delta-visuals-0_6_0-A-root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaVisuals
          path: |
            delta-visuals-0_6_0-A-root/build/libs/*.jar
            !delta-visuals-0_6_0-A-root/build/libs/*-sources.jar
            !delta-visuals-0_6_0-A-root/build/libs/*-dev.jar
